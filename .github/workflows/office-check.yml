name: PickPack Office code readiness
on:
  push:
    branches: [feat/offline-ui-prototype-20261114]
    paths:
      - 'prototype/**'
      - '.github/workflows/office-check.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/office-check.yml'
jobs:
  office-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript source and static build
        run: |
          npm run check
          npm run build
      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run Chromium business smoke
        run: python tests/browser_smoke.py
      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-ui-browser-debug
          path: prototype/preview-*.png
          if-no-files-found: ignore
