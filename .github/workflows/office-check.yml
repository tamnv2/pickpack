name: PickPack Office code readiness
on:
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/office-check.yml'
jobs:
  office-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript source and static build
        run: |
          npm run check
          npm run build
      - name: Install Chromium test runner
        run: |
          python -m pip install playwright==1.56.0 openpyxl==3.1.5
          python -m playwright install --with-deps chromium
      - name: Run Chromium business smoke
        run: python tests/browser_smoke.py
      - name: Validate hosted browser navigation and cross-tab business flows
        run: python tests/hosted_smoke.py
      - name: Verify public static test preview (read-only CDN)
        continue-on-error: true
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os, urllib.request
          base = 'https://rawcdn.githack.com/tamnv2/pickpack/'+os.environ['PREVIEW_SHA']+'/prototype/'
          for path, needle in [('index.html',b'assets/app.js'),('assets/app.js',b'WEB_VERSION'),('assets/styles.css',b'.site-footer')]:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={'User-Agent':'PickPack-Preview-Check/1.0'}),timeout=25) as response:
                  body=response.read()
                  mime=response.headers.get('Content-Type','')
                  assert response.status==200 and needle in body, (path,response.status)
                  print('PREVIEW_FILE_OK',path,'bytes',len(body),'mime',mime)
          print('PUBLIC_PREVIEW_HTTP_PASS',base+'index.html')
          PY
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          base='https://rawcdn.githack.com/tamnv2/pickpack/'+os.environ['PREVIEW_SHA']+'/prototype/'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              context=browser.new_context()
              # GitHack may show a one-time safety confirmation before serving arbitrary HTML.
              context.add_cookies([{'name':'__Http-phish','value':'1','domain':'rawcdn.githack.com','path':'/','secure':True,'httpOnly':True}])
              page=context.new_page()
              response=page.goto(base+'index.html',wait_until='domcontentloaded',timeout=30000)
              assert response and response.ok, ('HTTP',response.status if response else None)
              page.locator('form#login-form').wait_for(timeout=10000)
              assert page.locator('.login-links .web-version').inner_text()=='Web v0.9.4'
              page.locator('#demo-user').fill('admin')
              page.locator('#demo-password').fill('admin')
              page.locator('#login-form button[type="submit"]').click()
              page.wait_for_url('**/app.html?view=dashboard*',timeout=10000)
              assert page.locator('.site-footer').inner_text()=='Phát triển hệ thống - tamnv2 | Pick Pack 1291'
              print('PUBLIC_PREVIEW_BROWSER_PASS',base+'index.html')
              browser.close()
          PY
      - name: Preserve browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-ui-browser-debug
          path: prototype/preview-*.png
          if-no-files-found: ignore
